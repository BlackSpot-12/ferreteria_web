{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar pedido - Bimetálica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #F4F3EF; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; }
        .card { width: min(100% - 2rem, 480px); }
    </style>
</head>
<body>
    <main class="card border-0 shadow p-4">
        <div class="text-center mb-3"><img src="{% static 'tienda/logo.png' %}" alt="Bimetálica" height="70"></div>
        <h1 class="h4 text-center mb-3">Consultar pedido de invitado</h1>
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %} py-2 small">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="POST" action="{% url 'consultar_pedido_invitado' %}">
            {% csrf_token %}
            <label for="codigo_acceso" class="form-label">Código privado del comprobante</label>
            <input id="codigo_acceso" name="codigo_acceso" type="password" class="form-control mb-3" autocomplete="off" required>
            <button type="submit" class="btn btn-primary w-100">Consultar estado</button>
        </form>
        <a href="{% url 'inicio' %}" class="btn btn-link mt-2">Volver al catálogo</a>
    </main>
</body>
</html>
