{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisa tu correo - Bimetálica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #F4F3EF; min-height: 100vh; display: grid; place-items: center; font-family: 'Segoe UI', system-ui, sans-serif; }
        .confirmation-card { width: min(100% - 2rem, 440px); border: 0; border-radius: 12px; }
        .confirmation-header { background: #14283C; color: white; border-radius: 12px 12px 0 0; }
    </style>
</head>
<body>
    <main class="card confirmation-card shadow">
        <div class="confirmation-header p-4 text-center">
            <img src="{% static 'tienda/logo.png' %}" alt="BIMETÁLICA" height="60">
        </div>
        <div class="card-body p-4 text-center">
            <h1 class="h4">Revisa tu correo</h1>
            <p class="text-muted">Si el correo está registrado, recibirás instrucciones para restablecer tu contraseña.</p>
            <a href="{% url 'login' %}" class="btn btn-primary">Volver a iniciar sesión</a>
        </div>
    </main>
</body>
</html>
