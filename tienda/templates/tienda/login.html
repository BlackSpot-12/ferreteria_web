{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Bimetálica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #F4F3EF;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { width: 100%; max-width: 420px; border: none; border-radius: 10px; overflow: hidden; }
        .login-header { background-color: #14283C; color: #FFFFFF; padding: 22px; text-align: center; }
        .btn-naranja { background-color: #E66E19; color: #FFFFFF; border: none; font-weight: 700; padding: 10px; border-radius: 8px; }
        .btn-naranja:hover { background-color: #cf5f10; color: #FFFFFF; }
        .input-group-text { background-color: #F8F9FA; color: #14283C; }
    </style>
</head>
<body>

    <div class="card login-card shadow my-4">
        <div class="login-header">
            <img src="{% static 'tienda/logo.png' %}" alt="BIMETÁLICA" height="65">
        </div>
        <div class="card-body p-4 bg-white">
            <h4 class="text-center fw-semibold mb-4" style="color: #14283C;">Iniciar Sesión</h4>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2 small text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-3">
                    <label class="form-label text-secondary">Usuario o Correo</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" name="credencial" class="form-control" placeholder="Ingresa tu usuario o correo" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-naranja w-100">Ingresar</button>
            </form>
            <div class="text-center mt-3 pt-2 border-top">
                <span class="text-muted small">¿Eres cliente nuevo?</span>
                <a href="{% url 'registro' %}" class="fw-bold text-decoration-none small ms-1" style="color: #E66E19;">
                    Crea tu cuenta aquí
                </a>
            </div>

            <div class="mt-4">
                <a href="{% url 'inicio' %}" class="btn w-100 py-2 fw-bold text-uppercase shadow-sm" style="background-color: #d1d5db; color: #14283C; border-radius: 8px; letter-spacing: 0.5px;">
                    Volver al catálogo
                </a>
            </div>
        </div>
    </div>

</body>
</html>
