<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bimetálica | Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .bg-petroleo { background-color: #14283C; }
        .text-petroleo { color: #14283C; }
        .btn-naranja { background-color: #F47721; color: #F3F2ED; border: none; font-weight: bold; }
        .btn-naranja:hover { background-color: #d66415; color: white; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100" style="background-color: #F3F2ED;">

    <div class="card shadow border-0" style="width: 100%; max-width: 400px;">
        <div class="card-header bg-petroleo text-white text-center py-4">
            <h3 class="mb-0 fw-bold">BIMETÁLICA</h3>
        </div>
        <div class="card-body p-4">
            <h5 class="text-center text-petroleo mb-4">Iniciar Sesión</h5>
            
            <form>
                <div class="mb-3">
                    <label class="form-label text-muted">Usuario o Correo</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person-fill"></i></span>
                        <input type="text" class="form-control" placeholder="Ej: empleado01">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn btn-naranja w-100 py-2">Ingresar</button>
            </form>

            <div class="mt-4">
                <a href="{% url 'inicio' %}" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center" style="border-color: #315B78; color: #315B78;">
                    <i class="bi bi-arrow-left me-2"></i> Volver al catálogo
                </a>
            </div>
    </div>

</body>
</html>
