<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bimetálica | Inicio</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Paleta de colores oficial de Bimetálica */
        .bg-petroleo { background-color: #14283C; }
        .bg-acero { background-color: #315B78; }
        .text-calido { color: #F3F2ED; }
        .btn-naranja { background-color: #F47721; color: #F3F2ED; border: none; font-weight: bold; }
        .btn-naranja:hover { background-color: #d66415; color: white; }
        .text-grafito { color: #30363D; }
    </style>
</head>
<body style="background-color: #F3F2ED;">

    
    <nav class="navbar navbar-expand-lg bg-petroleo" data-bs-theme="dark" style="padding: 15px 0;">
        <div class="container">
            
            <a class="navbar-brand text-calido fw-bold fs-3" href="#">
                BIMETÁLICA
            </a>
            
           
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                
                <form class="d-flex mx-auto w-50 my-3 my-lg-0">
                    <input class="form-control me-2" type="search" placeholder="Buscar productos, marcas, códigos..." aria-label="Buscar">
                    <button class="btn btn-naranja" type="submit">Buscar</button>
                </form>
                
               
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link text-calido fw-semibold" href="#">Iniciar sesión</a>
                    </li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <a class="btn btn-naranja d-flex align-items-center" href="#">
                            Carrito <span class="badge bg-light text-grafito ms-2">0</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="bg-acero py-2 shadow-sm">
        <div class="container d-flex flex-wrap justify-content-center gap-3 gap-lg-5">
            <a href="#" class="text-calido text-decoration-none fw-semibold">Plomería</a>
            <a href="#" class="text-calido text-decoration-none fw-semibold">Electricidad</a>
            <a href="#" class="text-calido text-decoration-none fw-semibold">Herramientas</a>
            <a href="#" class="text-calido text-decoration-none fw-semibold">Construcción</a>
        </div>
    </div>

    
    <div class="container mt-5">
        <h2 class="text-grafito fw-bold">Productos Destacados</h2>
        <p class="text-muted">El catálogo se conectará a la API próximamente...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
